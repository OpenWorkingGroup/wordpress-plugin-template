name: Mirror to ByteableHub
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: byteablehub-mirror
  cancel-in-progress: false
jobs:
  mirror:
    if: vars.BYTEABLEHUB_MIRROR_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: byteablehub
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        id: app
        with:
          app-id: ${{ vars.BYTEABLEHUB_APP_ID }}
          private-key: ${{ secrets.BYTEABLEHUB_APP_PRIVATE_KEY }}
          owner: ByteableHub
          repositories: ${{ vars.BYTEABLEHUB_REPOSITORY }}
          permission-contents: write
      - run: python3 scripts/mirror.py
        env:
          UPSTREAM_TOKEN: ${{ github.token }}
          DOWNSTREAM_TOKEN: ${{ steps.app.outputs.token }}
          DOWNSTREAM_REPOSITORY: ${{ vars.BYTEABLEHUB_REPOSITORY }}
